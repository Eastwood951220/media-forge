<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Media Forge JavDB Agent</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }

      main {
        box-sizing: border-box;
        max-width: 560px;
        min-height: 100vh;
        padding: 24px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 22px;
        line-height: 30px;
      }

      label {
        display: block;
        margin: 14px 0;
        color: #334155;
        font-size: 13px;
        font-weight: 600;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        height: 42px;
        margin-top: 6px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 0 12px;
        background: #fff;
        color: #0f172a;
        font-size: 14px;
        outline: none;
      }

      input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      button {
        min-height: 40px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 0 14px;
        background: #fff;
        color: #0f172a;
        cursor: pointer;
        font-weight: 600;
      }

      button.primary {
        border-color: #2563eb;
        background: #2563eb;
        color: #fff;
      }

      .status-card {
        margin-top: 18px;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        background: #fff;
        padding: 14px;
      }

      #connectionStatus {
        margin: 0;
        font-weight: 700;
      }

      #statusUpdatedAt,
      #latestError {
        margin: 8px 0 0;
        color: #64748b;
        font-size: 13px;
        line-height: 20px;
      }

      #latestError {
        color: #dc2626;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #f8fafc;
        }

        label {
          color: #cbd5e1;
        }

        input,
        button,
        .status-card {
          border-color: #334155;
          background: #111827;
          color: #f8fafc;
        }

        button.primary {
          border-color: #3b82f6;
          background: #2563eb;
        }

        #statusUpdatedAt {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Media Forge Agent</h1>
      <label>
        Backend URL
        <input id="backendUrl" placeholder="http://127.0.0.1:8000" />
      </label>
      <label>
        Agent Token
        <input id="token" type="password" />
      </label>
      <div class="actions">
        <button id="save" class="primary">Save</button>
        <button id="reconnect">Reconnect</button>
      </div>
      <section class="status-card">
        <p id="connectionStatus">-</p>
        <p id="statusUpdatedAt">-</p>
        <p id="latestError"></p>
      </section>
    </main>
    <script type="module" src="/src/options.ts"></script>
  </body>
</html>
