<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Media Forge JavDB Agent</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 1rem; max-width: 480px; }
      label { display: block; margin: 0.75rem 0; }
      input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
      button { padding: 0.5rem 1rem; margin-top: 0.5rem; }
      #status { margin-top: 1rem; color: #555; }
      #latestError { color: #c00; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <label>
      Backend URL
      <input id="backendUrl" placeholder="http://127.0.0.1:8000" />
    </label>
    <label>
      Agent Token
      <input id="token" type="password" />
    </label>
    <button id="save">Save</button>
    <p id="connectionStatus">-</p>
    <p id="statusUpdatedAt">-</p>
    <p id="latestError"></p>
    <script type="module" src="/src/options.ts"></script>
  </body>
</html>
