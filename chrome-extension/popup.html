<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Media Forge Agent</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        width: 360px;
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }

      .popup {
        box-sizing: border-box;
        padding: 14px;
      }

      .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .title {
        margin: 0;
        font-size: 18px;
        line-height: 24px;
      }

      .version {
        color: #94a3b8;
        font-size: 12px;
        font-weight: 600;
      }

      .status-card,
      .section {
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        background: #fff;
        padding: 12px;
      }

      .status-card {
        margin-bottom: 10px;
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .status-text {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 8px;
        font-weight: 700;
      }

      .dot {
        width: 10px;
        height: 10px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: var(--status-color, #94a3b8);
        box-shadow: 0 0 0 4px var(--status-ring, #e2e8f0);
      }

      .status-idle,
      .status-connected {
        --status-color: #16a34a;
        --status-ring: #dcfce7;
      }

      .status-busy,
      .status-connecting,
      .status-handshaking {
        --status-color: #2563eb;
        --status-ring: #dbeafe;
      }

      .status-error {
        --status-color: #dc2626;
        --status-ring: #fee2e2;
      }

      .muted {
        color: #64748b;
        font-size: 12px;
        line-height: 18px;
      }

      .status-message {
        margin-top: 8px;
        word-break: break-word;
      }

      .meta-grid {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 8px 10px;
        margin-top: 10px;
        font-size: 12px;
      }

      .meta-label {
        color: #64748b;
      }

      .meta-value {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }

      button {
        min-height: 38px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #fff;
        color: #0f172a;
        cursor: pointer;
        font-weight: 700;
      }

      button.primary {
        border-color: #2563eb;
        background: #2563eb;
        color: #fff;
      }

      .section-title {
        margin: 0 0 8px;
        color: #334155;
        font-size: 13px;
        font-weight: 800;
      }

      .diagnostics {
        display: flex;
        max-height: 170px;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        padding-right: 2px;
      }

      .diagnostic {
        border-top: 1px solid #e2e8f0;
        padding-top: 8px;
      }

      .diagnostic:first-child {
        border-top: 0;
        padding-top: 0;
      }

      .diagnostic-meta {
        color: #64748b;
        font-size: 11px;
        line-height: 16px;
      }

      .diagnostic-message {
        margin-top: 2px;
        color: #0f172a;
        font-size: 12px;
        line-height: 18px;
        word-break: break-word;
      }

      .error-text {
        color: #dc2626;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #f8fafc;
        }

        .status-card,
        .section,
        button {
          border-color: #334155;
          background: #111827;
          color: #f8fafc;
        }

        button.primary {
          border-color: #3b82f6;
          background: #2563eb;
        }

        .section-title,
        .diagnostic-message {
          color: #f8fafc;
        }

        .muted,
        .meta-label,
        .diagnostic-meta {
          color: #94a3b8;
        }

        .diagnostic {
          border-top-color: #334155;
        }
      }
    </style>
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1 class="title">Media Forge Agent</h1>
        <span id="version" class="version"></span>
      </header>

      <section class="status-card">
        <div class="status-row">
          <div id="statusText" class="status-text">
            <span id="statusDot" class="dot"></span>
            <span id="statusLabel">-</span>
          </div>
          <span id="updatedAt" class="muted">-</span>
        </div>
        <div id="statusMessage" class="status-message muted">-</div>
        <div class="meta-grid">
          <span class="meta-label">Backend</span>
          <span id="backendUrl" class="meta-value">-</span>
          <span class="meta-label">Token</span>
          <span id="tokenState" class="meta-value">-</span>
          <span class="meta-label">Latest error</span>
          <span id="latestError" class="meta-value">-</span>
        </div>
      </section>

      <div class="actions">
        <button id="reconnect" class="primary">Reconnect</button>
        <button id="openOptions">Open Config</button>
        <button id="copyDiagnostics">Copy Diagnostics</button>
        <button id="clearDiagnostics">Clear Logs</button>
      </div>

      <section class="section">
        <h2 class="section-title">Recent Diagnostics</h2>
        <div id="diagnostics" class="diagnostics"></div>
      </section>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
